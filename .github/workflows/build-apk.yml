name: Compilar JARBAS APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de teste
        run: gradle assembleDebug --stacktrace

      - name: Assinar APK de teste
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/jarbas-debug.keystore" \
            -storepass android \
            -keypass android \
            -alias jarbas \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=JARBAS, OU=Android, O=JARBAS, L=Brasil, ST=SP, C=BR"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/jarbas-debug.keystore" \
            --ks-key-alias jarbas \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/debug/app-debug-signed.apk \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARBAS_Gol_1999_v1.0-debug
          path: app/build/outputs/apk/debug/app-debug-signed.apk
          if-no-files-found: error
